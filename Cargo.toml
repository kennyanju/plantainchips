[workspace]
resolver = "3"
members = [
    "crates/cloudsecure-types",
    "crates/cloudsecure-rql",
    "crates/cloudsecure-policy",
    "crates/cloudsecure-automation",
    "crates/cloudsecure-mcp",
    "apps/posturesecure",
    "apps/posturesecure-cli",
    "apps/datasecure",
    "apps/datasecure-cli",
    "apps/launchersecure",
    "apps/launchersecure-cli",
    "apps/graphsecure",
    "apps/graphsecure-cli",
    "apps/identitysecure",
    "apps/identitysecure-cli",
    "apps/workloadsecure",
    "apps/workloadsecure-cli",
    "apps/codesecure",
    "apps/codesecure-cli",
    "apps/waassecure",
    "apps/waassecure-cli",
    "apps/threatsecure",
    "apps/threatsecure-cli",
    "apps/netsecure",
    "apps/netsecure-cli",
    "apps/aisecure",
    "apps/aisecure-cli",
    "apps/supplysecure",
    "apps/supplysecure-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["CloudSecure Contributors <security@cloudsecure.dev>"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive", "env"] }
winnow = "0.7"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.43", features = ["full"] }
