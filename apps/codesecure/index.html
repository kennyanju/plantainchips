<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeSecure: ASPM & IaC Shift-Left Static Analyzer</title>
  <link rel="icon" type="image/svg+xml" href="/images/logo.svg">
  <link rel="stylesheet" href="/css/design-system.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0b0c;
      color: #f2f1ee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    #the_canvas_id {
      width: 100%;
      height: 100%;
    }
    .loading-fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 16px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #4ade80;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <link rel="rust" data-trunk href="Cargo.toml" data-bin="codesecure" data-wasm-opt="z" />
</head>
<body>
  <div id="loading" class="loading-fallback">
    <div class="spinner"></div>
    <div style="font-size: 1.1rem; font-weight: 600;">Starting CodeSecure...</div>
    <div style="font-size: 0.85rem; color: #a1a1aa;">Parsing Infrastructure as Code ASTs and building CycloneDX SBOM manifests</div>
  </div>
  <canvas id="the_canvas_id"></canvas>
  <script>
    window.addEventListener("TrunkApplicationStarted", function() {
      var loading = document.getElementById("loading");
      if (loading) {
        loading.style.display = "none";
      }
    });
  </script>
</body>
</html>
